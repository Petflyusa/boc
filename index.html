<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>系统维护中</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #f7f8fa; color: #25282e; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; }
    header { padding: 28px clamp(24px, 6vw, 88px); display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; border-top: 4px solid #a81d32; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; background: #a81d32; color: white; border-radius: 8px; }
    main { flex: 1; display: grid; place-items: center; padding: 40px 24px 72px; }
    .panel { width: min(100%, 660px); padding: 56px 48px 36px; background: white; border: 1px solid #e7e9ed; border-radius: 20px; box-shadow: 0 16px 60px #25304708; text-align: center; }
    .icon { margin: 0 auto 28px; width: 88px; height: 88px; display: grid; place-items: center; border-radius: 26px; background: #fbf0f2; color: #a81d32; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: #9a2436; background: #fbf0f2; border-radius: 30px; padding: 6px 12px; font-size: 12px; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    h1 { font-size: clamp(28px, 5vw, 36px); margin: 20px 0 16px; letter-spacing: 2px; line-height: 1.4; }
    .description { color: #646b76; font-size: 15px; line-height: 1.9; margin: 0; }
    .notice { margin: 32px 0; padding: 18px 20px; border-radius: 10px; background: #f7f8fa; color: #59616c; font-size: 13px; line-height: 1.9; }
    button { border: 0; border-radius: 8px; background: #a81d32; color: white; padding: 13px 30px; font: inherit; font-size: 14px; cursor: pointer; }
    button:hover { background: #89172a; }
    button:focus-visible { outline: 3px solid #a81d3266; outline-offset: 4px; }
    .thanks { margin: 24px 0 0; color: #7b828c; font-size: 12px; }
    footer { padding: 20px 24px 28px; color: #868c96; text-align: center; font-size: 12px; letter-spacing: 1px; }
    @media (max-width: 480px) { header { padding: 22px 24px; } main { padding: 20px 16px 36px; } .panel { padding: 36px 24px 28px; } .notice { margin: 24px 0; } }
  </style>
</head>
<body>
  <header><span class="brand-mark" aria-hidden="true">S</span>系统服务</header>
  <main>
    <section class="panel" aria-labelledby="maintenance-title">
      <div class="icon" aria-hidden="true">
        <svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="34" height="25" rx="4"/><path d="M18 40h12M24 33v7M18 20h12M24 14v12"/></svg>
      </div>
      <span class="status">服务暂时不可用</span>
      <h1 id="maintenance-title">系统维护中</h1>
      <p class="description">系统正在进行维护与升级。<br>维护期间暂停访问，请稍后再试。</p>
      <div class="notice">恢复时间将另行通知。<br>维护完成后，即可正常访问。</div>
      <button type="button" onclick="window.location.reload()">刷新页面</button>
      <p class="thanks">感谢您的理解与耐心等待</p>
    </section>
  </main>
  <footer>SYSTEM MAINTENANCE</footer>
</body>
</html>
